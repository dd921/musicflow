<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MusicFlow{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2A;
            --secondary: #1DB954;
            --accent: #FF3366;
            --dark: #0D0D0D;
            --dark-light: #1A1A1A;
            --dark-medium: #2D2D2D;
            --text: #FFFFFF;
            --text-muted: #A0A0A0;
            --text-dim: #666666;
            --gradient-1: linear-gradient(135deg, #FF6B35 0%, #FF3366 100%);
            --gradient-2: linear-gradient(135deg, #1DB954 0%, #00D4AA 100%);
            --gradient-3: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 30px rgba(255, 107, 53, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 107, 53, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(29, 185, 84, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 51, 102, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--dark-light);
            border-right: 1px solid var(--dark-medium);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .sidebar-header {
            padding: 30px 25px;
            border-bottom: 1px solid var(--dark-medium);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text);
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: var(--gradient-1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: var(--shadow-glow);
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 15px;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 25px;
        }

        .nav-section-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            padding: 0 10px;
            margin-bottom: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 4px;
            transition: var(--transition);
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--gradient-1);
            transform: scaleY(0);
            transition: var(--transition);
        }

        .nav-link:hover {
            background: var(--dark-medium);
            color: var(--text);
        }

        .nav-link:hover::before {
            transform: scaleY(1);
        }

        .nav-link.active {
            background: rgba(255, 107, 53, 0.15);
            color: var(--primary);
        }

        .nav-link.active::before {
            transform: scaleY(1);
        }

        .nav-link-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--dark-medium);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--dark-medium);
            border-radius: 10px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: var(--gradient-2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .user-status {
            font-size: 0.75rem;
            color: var(--secondary);
        }

        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .page-header {
            padding: 40px 50px 30px;
            background: linear-gradient(180deg, var(--dark-light) 0%, transparent 100%);
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .page-content {
            padding: 20px 50px 50px;
        }

        /* Cards */
        .card {
            background: var(--dark-light);
            border-radius: 16px;
            border: 1px solid var(--dark-medium);
            padding: 25px;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .card:hover {
            border-color: rgba(255, 107, 53, 0.3);
            box-shadow: var(--shadow);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--gradient-1);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.5);
        }

        .btn-secondary {
            background: var(--dark-medium);
            color: var(--text);
            border: 1px solid var(--dark-medium);
        }

        .btn-secondary:hover {
            background: var(--dark);
            border-color: var(--primary);
        }

        .btn-spotify {
            background: var(--gradient-2);
            color: white;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
        }

        .btn-spotify:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(29, 185, 84, 0.5);
        }

        .btn-strava {
            background: linear-gradient(135deg, #FC4C02 0%, #FF6B35 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(252, 76, 2, 0.4);
        }

        .btn-strava:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(252, 76, 2, 0.5);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Status Messages */
        .status-box {
            padding: 16px 20px;
            border-radius: 12px;
            margin-top: 15px;
            font-weight: 500;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .status-box.success {
            background: rgba(29, 185, 84, 0.15);
            border: 1px solid rgba(29, 185, 84, 0.3);
            color: var(--secondary);
        }

        .status-box.error {
            background: rgba(255, 51, 102, 0.15);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: var(--accent);
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--dark-light);
            border-radius: 12px;
            border: 1px solid var(--dark-medium);
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-select {
            background: var(--dark-medium);
            border: 1px solid var(--dark-medium);
            color: var(--text);
            padding: 10px 15px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .control-select:hover, .control-select:focus {
            border-color: var(--primary);
            outline: none;
        }

        .radio-group {
            display: flex;
            gap: 5px;
            background: var(--dark-medium);
            padding: 4px;
            border-radius: 8px;
        }

        .radio-btn {
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
            color: var(--text-muted);
        }

        .radio-btn:hover {
            color: var(--text);
        }

        .radio-btn.active {
            background: var(--primary);
            color: white;
        }

        .radio-btn input {
            display: none;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .animate-in {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .animate-delay-1 { animation-delay: 0.1s; }
        .animate-delay-2 { animation-delay: 0.2s; }
        .animate-delay-3 { animation-delay: 0.3s; }
        .animate-delay-4 { animation-delay: 0.4s; }
        .animate-delay-5 { animation-delay: 0.5s; }

        /* Scroll animations */
        .scroll-animate {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scroll-animate.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .page-header, .page-content {
                padding-left: 25px;
                padding-right: 25px;
            }

            .mobile-menu-btn {
                display: flex;
            }
        }

        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 101;
            width: 50px;
            height: 50px;
            background: var(--dark-light);
            border: 1px solid var(--dark-medium);
            border-radius: 12px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--dark-medium);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    
    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="{{ url_for('index') }}" class="logo">
                <div class="logo-icon">🎵</div>
                <span class="logo-text">MusicFlow</span>
            </a>
        </div>
        
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">Main</div>
                <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                    <span class="nav-link-icon">🏠</span>
                    <span>Dashboard</span>
                </a>
                <a href="{{ url_for('activities') }}" class="nav-link {% if request.endpoint == 'activities' %}active{% endif %}">
                    <span class="nav-link-icon">🏃</span>
                    <span>Activities</span>
                </a>
            </div>
            
            <div class="nav-section">
                <div class="nav-section-title">Music</div>
                <a href="{{ url_for('spotify_storage') }}" class="nav-link {% if request.endpoint == 'spotify_storage' %}active{% endif %}">
                    <span class="nav-link-icon">💾</span>
                    <span>Song History</span>
                </a>
                <a href="{{ url_for('spotify_debug') }}" class="nav-link {% if request.endpoint == 'spotify_debug' %}active{% endif %}">
                    <span class="nav-link-icon">🎧</span>
                    <span>Recent Tracks</span>
                </a>
            </div>
            
            <div class="nav-section">
                <div class="nav-section-title">Settings</div>
                <a href="{{ url_for('logout') }}" class="nav-link">
                    <span class="nav-link-icon">🚪</span>
                    <span>Logout</span>
                </a>
            </div>
        </nav>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <div class="user-details">
                    <div class="user-name">Athlete</div>
                    <div class="user-status">● Connected</div>
                </div>
            </div>
        </div>
    </aside>
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
        
        // Scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);
        
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.scroll-animate').forEach(el => {
                observer.observe(el);
            });
        });
        
        // Status message helper
        function showStatus(elementId, message, isError = false) {
            const statusDiv = document.getElementById(elementId);
            if (!statusDiv) return;
            statusDiv.style.display = 'block';
            statusDiv.className = 'status-box ' + (isError ? 'error' : 'success');
            statusDiv.innerHTML = message;
        }
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
