# MusicFlow Docker Compose Configuration
# For local development and self-hosted production deployments

version: '3.8'

services:
  musicflow:
    build: .
    container_name: musicflow
    ports:
      - "8000:8000"
    environment:
      # Required: Set these in your environment or .env file
      - FLASK_ENV=${FLASK_ENV:-production}
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:?STRAVA_CLIENT_ID is required}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:?STRAVA_CLIENT_SECRET is required}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:?SPOTIFY_CLIENT_ID is required}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:?SPOTIFY_CLIENT_SECRET is required}
      # Database path inside container (mapped to volume)
      - DATABASE_PATH=/data/musicflow.db
    volumes:
      # Persistent storage for database
      - musicflow-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  musicflow-data:
    driver: local

# ===========================================
# USAGE INSTRUCTIONS
# ===========================================
#
# 1. Copy .env.example to .env and fill in your values:
#    cp .env.example .env
#    # Edit .env with your API credentials and settings
#
# 2. Build and start:
#    docker-compose up -d --build
#
# 3. View logs:
#    docker-compose logs -f
#
# 4. Stop:
#    docker-compose down
#
# 5. Stop and remove data (WARNING: deletes database):
#    docker-compose down -v
#
# ===========================================
# PRODUCTION NOTES
# ===========================================
#
# For production deployment:
# 1. Set FLASK_ENV=production
# 2. Generate a secure SECRET_KEY:
#    python -c "import secrets; print(secrets.token_hex(32))"
# 3. Set BASE_URL to your public URL
# 4. Consider adding a reverse proxy (nginx/traefik) for SSL
# 5. Update Strava/Spotify dashboards with production callback URLs
